<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="thruster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Stars -->
  <circle cx="80" cy="100" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="420" cy="80" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="440" cy="380" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="70" cy="360" r="2" fill="#fde047" opacity="0.6"/>

  <!-- Jetpack Exhaust Flames (Downward) -->
  <path d="M 175 320 Q 175 460 190 480 Q 205 460 205 320 Z" fill="url(#fire)" filter="url(#glow)"/>
  <path d="M 307 320 Q 307 460 322 480 Q 337 460 337 320 Z" fill="url(#fire)" filter="url(#glow)"/>
  <path d="M 183 330 Q 183 420 190 440 Q 197 420 197 330 Z" fill="url(#thruster)"/>
  <path d="M 315 330 Q 315 420 322 440 Q 329 420 329 330 Z" fill="url(#thruster)"/>

  <!-- Jetpack Pods -->
  <rect x="165" y="220" width="50" height="110" rx="14" fill="#334155" stroke="#64748b" stroke-width="4"/>
  <rect x="297" y="220" width="50" height="110" rx="14" fill="#334155" stroke="#64748b" stroke-width="4"/>

  <!-- Astronaut Suit Shoulders & Torso -->
  <path d="M 150 350 C 150 250, 362 250, 362 350 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="6"/>
  <path d="M 215 270 L 297 270 L 285 330 L 227 330 Z" fill="#0284c7"/>

  <!-- Astronaut Helmet Outer Ring -->
  <circle cx="256" cy="180" r="115" fill="#f8fafc" stroke="#cbd5e1" stroke-width="8"/>

  <!-- Golden Sun-Shield Visor -->
  <ellipse cx="256" cy="180" rx="90" ry="72" fill="url(#gold)" stroke="#78350f" stroke-width="4"/>

  <!-- Visor Specular Reflection -->
  <ellipse cx="230" cy="155" rx="55" ry="32" fill="#ffffff" opacity="0.45" transform="rotate(-15 230 155)"/>

  <!-- Helmet Communicator Earpieces -->
  <rect x="130" y="160" width="18" height="40" rx="8" fill="#475569"/>
  <rect x="364" y="160" width="18" height="40" rx="8" fill="#475569"/>

  <!-- Repulsor Board / Speed Lines -->
  <line x1="90" y1="410" x2="422" y2="410" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
</svg>
